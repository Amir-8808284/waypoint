{% extends "base.html" %}

{% block title %}Search Trails - Waypoint{% endblock %}

{% block content %}

<h1>Search Trails</h1>

<form method="get">
    <label for="q">Search:</label>

    <input
        type="text"
        id="q"
        name="q"
        value="{{ query }}"
    >

    <button type="submit">Search</button>
</form>

{% if query %}
    <h2>Search Results</h2>

    <p>You searched for: {{ query }}</p>
{% endif %}

{% endblock %}
